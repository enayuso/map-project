# Phase 1 backend: PostGIS (the canonical geodata store, reused by later phases
# for geocoding/routing too) + Martin (serves vector tiles straight from PostGIS).
# Local dev only — credentials below are dev-only, not real secrets.

services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: belize-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: belize
      POSTGRES_USER: belize
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpass123}
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      # Bound to loopback only — the Simulator/host reach this fine over
      # 127.0.0.1 (confirmed throughout this project), and this keeps a
      # dev Postgres with a known default password off the local network,
      # not just off the public internet.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U belize -d belize"]
      interval: 5s
      timeout: 5s
      retries: 10

  martin:
    image: ghcr.io/maplibre/martin:latest
    container_name: belize-martin
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy
    command: ["--config", "/config/martin-config.yaml"]
    volumes:
      - ./martin-config.yaml:/config/martin-config.yaml:ro
      - ../data/satellite:/data/satellite:ro
      - ../data/fonts:/fonts:ro
      - ../styles:/styles:ro
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  postgis_data:
