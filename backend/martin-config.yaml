# Martin config: only publish our own OSM tables, not PostGIS's bundled
# tiger_geocoder demo schema. Regenerate the `tables:` block with:
#   docker exec belize-martin martin --save-config /tmp/out.yaml <connection_string>
# if the schema changes (e.g. after re-importing with different osm2pgsql options).

# Satellite basemap (see scripts/build_satellite_mosaic.sh) — a pre-baked
# raster tile pyramid, not PostGIS-backed like everything else here. Martin
# serves MBTiles files directly (just passes the stored PNG/WebP bytes
# through, no on-the-fly rendering), so no separate raster tile server is
# needed alongside it.
mbtiles:
  sources:
    satellite: /data/satellite/belize_satellite.mbtiles

# Publishes ../styles/*.json (the canonical style files, synced to
# mobile/src/styles/ for the app's own bundled copy) as fetchable style
# URLs — needed for Phase 5's offline-maps feature, since MapLibre Native's
# OfflineManager.createPack() needs an actual URL for its `mapStyle` option,
# not an inline JS object the way <Map mapStyle={basicStyle}> normally
# takes it. Confirmed via Martin's own docs: publishes each file under its
# filename at /style/<name> (e.g. /style/basic, /style/hybrid).
styles:
  paths:
    - /styles

# Self-hosted glyphs (Noto Sans Regular/Bold, the only fontstacks our
# styles/*.json reference) — see data/fonts/README.md. Fixes a real
# maplibre-native crash: offline pack downloads abort with an uncaught
# std::regex_error when a style's `glyphs` URL points at
# demotiles.maplibre.org (github.com/maplibre/maplibre-native/issues/4403).
# Self-hosting (rather than pointing at some other third party) also means
# offline downloads for remote Belize areas don't depend on an external
# font server's uptime.
fonts:
  paths:
    - /fonts

