# Phase 4.5: live location sharing. A small custom FastAPI service — not an
# off-the-shelf tool like every other service in this project, but the
# actual custom logic here is four small endpoints over one Postgres table,
# genuinely too small to justify pulling in unfamiliar new infrastructure
# (e.g. Redis + a Redis-to-HTTP bridge) just to keep "no custom code" —
# joins the Phase 1 backend's network to reach the same shared `belize`
# Postgres database every other service already writes to (see
# scripts/create_location_shares_table.sh for the one-time schema setup).
#
# Local dev only — DB credentials below are the same dev-only ones as
# backend/docker-compose.yml, not real secrets.

services:
  sharing:
    build: .
    container_name: belize-sharing
    restart: unless-stopped
    environment:
      DB_HOST: postgis
      DB_NAME: belize
      DB_USER: belize
      DB_PASSWORD: ${DB_PASSWORD:-devpass123}
      # Gates the /admin/* moderation routes (main.py's require_admin) —
      # unset by default, meaning those routes stay locked out until you
      # set a real value in sharing/.env. No default here on purpose,
      # unlike DB_PASSWORD above: failing closed is the right default for
      # something that guards a delete, not a shared dev-only credential.
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    ports:
      # Bound to loopback only — see backend/docker-compose.yml's own
      # comment on this; same reasoning applies to every service's ports.
      - "127.0.0.1:8090:8090"
    volumes:
      # Read-only mount of the repo's scripts/ — lets scripts/
      # review_poi_corrections.py run inside this container (already has
      # psycopg2 + network access to both postgis and typesense) without
      # needing its own image/rebuild just for an admin CLI tool.
      - ../scripts:/scripts:ro
      # Read-only mount of curated ferry/dive-site content — editing these
      # JSON files + `docker compose restart sharing` picks up changes
      # with no image rebuild, since this is hand-maintained reference
      # content refreshed every few months, not a database migration.
      - ./data:/app/data:ro
      # Test-only files, mounted rather than baked into the production
      # image (see Dockerfile — it only COPYs main.py) — editing a test
      # doesn't need a rebuild, same reasoning as the two mounts above.
      - ./app/test_main.py:/app/test_main.py:ro
      - ./app/requirements-dev.txt:/app/requirements-dev.txt:ro
    networks:
      default:
      backend_net:

networks:
  default:
  backend_net:
    name: backend_default
    external: true
